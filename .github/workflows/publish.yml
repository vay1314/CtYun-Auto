name: Build and publish CtYunKeeper

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Read project version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.image.outputs.name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read project version
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must use the X.Y.Z format" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set Docker image name
        id: image
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" ]]; then
            echo "Repository variable DOCKERHUB_USERNAME is not configured" >&2
            exit 1
          fi
          echo "name=${DOCKERHUB_USERNAME,,}/ctyun-keeper" >> "$GITHUB_OUTPUT"

  docker:
    name: Build and push Docker image
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.prepare.outputs.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=v${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  windows:
    name: Build Windows ${{ matrix.goarch }}
    needs: prepare
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        goarch:
          - amd64
          - arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        shell: pwsh
        run: go test ./...

      - name: Build and package
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_ARCH: ${{ matrix.goarch }}
        run: |
          $folderName = "CtYunKeeper-v$env:APP_VERSION-windows-$env:TARGET_ARCH"
          $folder = Join-Path dist $folderName
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $folder 'data') | Out-Null
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = $env:TARGET_ARCH
          go build -trimpath -ldflags "-s -w -X main.version=$env:APP_VERSION" -o (Join-Path $folder 'ctyun-keeper.exe') ./cmd/ctyun-keeper
          Copy-Item -Recurse app/web/static (Join-Path $folder 'static')
          Copy-Item packaging/windows/config.env (Join-Path $folder 'config.env')
          Copy-Item packaging/windows/start.bat (Join-Path $folder 'start.bat')
          Copy-Item packaging/windows/README.txt (Join-Path $folder 'README.txt')
          Compress-Archive -Path $folder -DestinationPath (Join-Path dist "$folderName.zip") -CompressionLevel Optimal

      - name: Upload packaged program
        uses: actions/upload-artifact@v4
        with:
          name: CtYunKeeper-windows-${{ matrix.goarch }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs:
      - prepare
      - docker
      - windows
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          pattern: CtYunKeeper-windows-*
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: CtYunKeeper v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          overwrite_files: true
          files: dist/*.zip
          fail_on_unmatched_files: true

