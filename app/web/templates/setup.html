{% extends "base.html" %}
{% block title %}初始化 · ctyun-auto{% endblock %}
{% block content %}
<section class="auth-card">
  <div class="brand-mark large material-symbols-rounded">cloud_sync</div>
  <p class="eyebrow">首次启动</p>
  <h1>设置管理密码</h1>
  <p class="muted">此密码只用于访问本机管理面板。账号凭据将加密保存在挂载的数据目录。</p>
  {% if error %}<div class="form-error">{{ error }}</div>{% endif %}
  <form method="post" action="/setup" class="stack-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>管理密码<input name="password" type="password" minlength="8" required autocomplete="new-password"></label>
    <label>确认密码<input name="confirmation" type="password" minlength="8" required autocomplete="new-password"></label>
    <button class="primary" type="submit">进入控制中心</button>
  </form>
</section>
{% endblock %}
